[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentflow-cytometry"
version = "0.1.0"
description = "Reproducible FlowKit analyses with an optional Matplotlib gate editor"
requires-python = ">=3.11"
dependencies = ["flowkit>=1.3,<1.4", "numpy>=2,<3", "pandas>=2.2,<3", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
gui = ["PySide6>=6.7,<7"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
agentflow = "agentflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentflow"]

[tool.ruff]
line-length = 110
