[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentflow-cytometry"
version = "0.7.1"
readme = "README.md"
description = "Reproducible flow cytometry screens with an optional desktop gate editor"
authors = [{name = "Becca Carlson"}]
maintainers = [{name = "Becca Carlson"}]
requires-python = ">=3.14"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<3", "matplotlib>=3.9,<3.11",
    "anytree>=2.13", "bokeh>=3.5", "contourpy>=1.3.1",
    "flowio>=1.4.0,<1.5", "flowutils>=1.2.2,<1.3", "lxml>=6.0",
    "networkx>=3.3", "psutil>=7", "pyarrow>=18", "scipy>=1.14", "PyYAML>=6,<7"
]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/agentflow/_vendor/flowkit/LICENSE", "src/agentflow/assets/fonts/*-OFL.txt"]

[project.optional-dependencies]
gui = ["PySide6>=6.7,<7"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]
build = ["hatchling"]
security = ["pip-audit>=2.9,<3"]

[project.scripts]
agentflow = "agentflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentflow"]

[tool.ruff]
line-length = 110
extend-exclude = ["src/agentflow/_vendor/flowkit"]

[tool.uv]
# uv carries its own root certificates; releases before 0.13.4 trust the eMudhra
# intermediates compromised on 2026-10-19. uv refuses to run here on an older version.
required-version = ">=0.13.4"
exclude-newer = "7 days"
# Security fixes that cannot wait out the quarantine: these releases drop the root behind
# the compromised eMudhra intermediates. Remove once they are older than 7 days.
exclude-newer-package = { certifi = false, pip = false }
# Security floors (eMudhra CA compromise, 2026-10-19), also enforced by the shared
# dependency guard in Deliverome-Project/.github.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2"]

