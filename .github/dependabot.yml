# Keep dependencies current: monthly grouped PRs; majors come as their own PRs (that is where
# breakage is). The 7-day cooldown is a supply-chain quarantine: Dependabot never proposes a
# release less than a week old. Same policy across Deliverome repos.
# Major versions wait 30 days instead of 7, so the first bugfix releases (x.0.1...) are out.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30   # majors wait a month so their first bugfix releases are out
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The gate editor's polygon selector uses matplotlib internals that 3.11 removed
      # (GatePolygonSelector._get_data_coords); pyproject caps matplotlib<3.11 for the
      # same reason. Drop this once gate_selectors.py supports 3.11.
      - dependency-name: matplotlib
        versions: [">=3.11"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 3
