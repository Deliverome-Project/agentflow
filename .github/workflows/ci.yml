name: checks
on: [push, pull_request]
permissions:
  contents: read
env:
  UV_EXCLUDE_NEWER: "7 days"
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
      - run: python3 scripts/check_dependency_age.py
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run pytest -q
        env:
          MPLBACKEND: Agg
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
      - run: python3 scripts/check_dependency_age.py
      - run: uv sync --locked --group build --python 3.14
      - run: uv build --no-build-isolation
      - run: uv run --locked python scripts/check_release_contents.py
      - run: uv run --isolated --no-project --python 3.14 --with ./dist/agentflow_cytometry-0.10.0-py3-none-any.whl python scripts/wheel_smoke.py
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: python3 scripts/check_dependency_age.py
      - run: uv sync --locked --extra gui --python 3.14
      - run: uv run pytest tests/test_desktop.py tests/test_workbench.py -q
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
      - run: python3 scripts/check_dependency_age.py
      - run: uv sync --locked --extra gui --python 3.14
      - run: uv run --locked pytest tests/test_desktop.py tests/test_workbench.py -q
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
